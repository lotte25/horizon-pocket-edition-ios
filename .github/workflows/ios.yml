name: ios
run-name: iOS · ${{ inputs.mods && format('native mods {0} · ', inputs.mods) || '' }}${{ github.sha }}
# Horizon Pocket Edition (iOS): cross-compiled for aarch64-apple-ios and packaged as an unsigned .ipa.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deliver:
        description: Make and keep the unsigned .ipa
        type: boolean
        default: false
      mods:
        description: "Native mods to build in (ids, spaces or commas; empty = no native mods); keeps the .ipa"
        type: string
        default: "appleskin armor_status biomecompass connected_textures coords_hud dynamiclights enchantmenthints jade rightharvest shulker_peek smartf3 status_effect_hud worldmap zoom"
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.mods }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  HORIZON_IOS_REPO: ${{ github.repository }}
  HORIZON_IOS_BRANCH: ${{ github.ref_name }}

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      IOS_TARGET: aarch64-apple-ios
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and its iOS standard library
        run: |
          rustup toolchain install stable --profile minimal --target "$IOS_TARGET"
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
          cache-on-failure: true
          save-if: ${{ !inputs.mods }}
      - uses: actions/cache@v4
        if: ${{ inputs.mods }}
        with:
          path: ~/.cache/starling-native
          key: native-mixins-${{ runner.os }}-${{ hashFiles('packaging/android/native_build.sh') }}
      - name: Stage native mods
        if: ${{ inputs.mods }}
        env:
          MODS: ${{ inputs.mods }}
        run: |
          set -euo pipefail -f
          printf '{"projects":[]}\n' > "$RUNNER_TEMP/index.json"
          python3 tools/ios_native_mods.py fetch "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/native" ${MODS//,/ }
          python3 tools/ios_native_mods.py info "$RUNNER_TEMP/native" "$GITHUB_SHA" > "$RUNNER_TEMP/native-mods.json"
          bash packaging/ios/native_stage.sh . "$RUNNER_TEMP/native/bundles"
      - name: Build the game
        env:
          HORIZON_IOS_PUBLIC: "1"
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        run: |
          export HORIZON_IOS_BUILD_COMMIT="$GITHUB_SHA"
          cargo build --release --target "$IOS_TARGET" -p horizon-ios-game
      # Cache .local/ios/assets (engine-data.zip, lowbudget.zip, StarlingVisuals.zip) so Java/prepare
      # only runs when Minecraft pins, exporters, or bundled art actually change.
      - name: Restore cached iOS assets
        id: ios-assets
        uses: actions/cache@v4
        with:
          path: .local/ios/assets
          key: ios-assets-${{ hashFiles('research-lock.json', 'exporters/**', 'crates/horizon-prepare/**', 'crates/horizon-ios-prepare/**', 'packaging/lowbudget/**', 'packaging/shaderpacks/starling-visuals/**') }}
      - uses: actions/setup-java@v4
        if: ${{ steps.ios-assets.outputs.cache-hit != 'true' }}
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        if: ${{ steps.ios-assets.outputs.cache-hit != 'true' }}
        with:
          path: .local/ios-cache/minecraft
          key: ios-minecraft-${{ hashFiles('research-lock.json') }}
      - name: Build iOS assets (cache miss)
        if: ${{ steps.ios-assets.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          hdiutil create -size 16g -fs 'Case-sensitive APFS' -volname StarlingPrep -type SPARSE \
            "$RUNNER_TEMP/prep.sparseimage" > /dev/null
          hdiutil attach "$RUNNER_TEMP/prep.sparseimage" > /dev/null
          python3 tools/ios_prepare.py --java-home "$JAVA_HOME" \
            --minecraft .local/ios-cache/minecraft --work /Volumes/StarlingPrep/work
      - name: Bundle it
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonPE.xcodeproj \
            -target HorizonPE -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-build.log 2>&1 || { tail -80 xcode-build.log; exit 1; }
          app=build-ios/HorizonPE.app
          for asset in engine-data.zip lowbudget.zip StarlingVisuals.zip; do
            test -f "$app/assets/$asset" || { echo "::error::the app has no assets/$asset"; exit 1; }
          done
          if [ -f "$RUNNER_TEMP/native-mods.json" ]; then
            cp "$RUNNER_TEMP/native-mods.json" "$app/native-mods.json"
          fi
          rm -rf game && mkdir -p game/Payload
          cp -a "$app" game/Payload/
          ( cd game && zip -qry ../HorizonPE-iOS-unsigned.ipa Payload )
          ls -l HorizonPE-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.deliver || inputs.mods }}
        with:
          name: horizon-pe-ios-${{ github.run_number }}${{ inputs.mods && '-native-mods' || '' }}
          path: HorizonPE-iOS-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
