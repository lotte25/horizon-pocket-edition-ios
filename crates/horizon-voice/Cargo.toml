[package]
name = "horizon-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Voice chat between the players of a world: the codec, the messages, the microphone's clean-up, each speaker's buffer, and the engine that ties them"

[dependencies]
# The codec: libopus (BSD), built with the crate (opusic-sys). 48 kHz mono speech at ~32 kbit/s.
opus = "0.4"
# The noise filter a player may turn on (RNNoise in Rust, BSD): the library alone, without its
# command line tool.
nnnoiseless = { version = "0.5", default-features = false }
# Simple Voice Chat UDP encryption (AES-128-GCM for v20/v21, AES-128-CBC/PKCS7 for v18).
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
